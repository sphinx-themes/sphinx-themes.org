version: 2
build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"
  jobs:
    install:
      - pip install nox
      - nox -s publish --install-only
    build:
      html:
        - nox -s publish -- default-alabaster furo sphinx-rtd-theme sphinx-book-theme pydata-sphinx-theme
        - mkdir -p $READTHEDOCS_OUTPUT/html/
        - mv public/* $READTHEDOCS_OUTPUT/html/
